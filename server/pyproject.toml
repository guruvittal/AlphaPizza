[project]
name = "alpha-pizza-backend"
version = "0.1.0"
description = "FastAPI backend for Alpha Pizza Evolutionary Deal Finder"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "google-genai>=0.1.1",
    "google-adk>=0.1.0",
    "pydantic>=2.6.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
